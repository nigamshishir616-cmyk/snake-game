<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Snake</title>
<style>
  :root { --bg:#10261c; --board:#0b1a13; --snake:#7ddf64; --food:#ff6b4a; --text:#eaf5ec; --muted:#9bb8a5; }
  * { box-sizing: border-box; }
  body { margin:0; min-height:100vh; display:grid; place-items:center; background:var(--bg); color:var(--text); font-family:"Courier New", monospace; padding:1rem; }
  main { text-align:center; width:100%; max-width:380px; }
  h1 { margin:0 0 .3rem; }
  .bar { display:flex; justify-content:space-between; margin-bottom:.5rem; color:var(--muted); }
  canvas { width:100%; aspect-ratio:1; background:var(--board); border:3px solid var(--snake); border-radius:8px; touch-action:none; }
  #msg { min-height:1.6rem; margin:.6rem 0; }
  .pad { display:grid; grid-template-columns:repeat(3, 64px); grid-template-rows:repeat(2, 56px); gap:6px; justify-content:center; margin-top:.5rem; }
  .pad button { font-size:1.4rem; border:0; border-radius:8px; background:#1d4a35; color:var(--text); cursor:pointer; }
  .pad button:active { background:var(--snake); color:#10261c; }
  #up { grid-column:2; } #left { grid-column:1; grid-row:2; } #down { grid-column:2; grid-row:2; } #right { grid-column:3; grid-row:2; }
  #start { padding:.6rem 1.4rem; font-size:1rem; font-weight:bold; font-family:inherit; border:0; border-radius:8px; background:var(--snake); color:#10261c; cursor:pointer; }
  button:focus-visible { outline:3px solid var(--food); outline-offset:2px; }
</style>
</head>
<body>
<main>
  <h1>Snake</h1>
  <div class="bar"><span>Score: <span id="score">0</span></span><span>Best: <span id="best">0</span></span></div>
  <canvas id="board" width="400" height="400" aria-label="Snake game board"></canvas>
  <p id="msg">Press Start, then use arrow keys, WASD, or the buttons.</p>
  <button id="start">Start</button>
  <div class="pad">
    <button id="up" aria-label="Up">▲</button>
    <button id="left" aria-label="Left">◀</button>
    <button id="down" aria-label="Down">▼</button>
    <button id="right" aria-label="Right">▶</button>
  </div>
</main>

<script>
  const SIZE = 20, CELL = 20;
  const canvas = document.getElementById("board");
  const ctx = canvas.getContext("2d");
  const scoreEl = document.getElementById("score");
  const bestEl = document.getElementById("best");
  const msg = document.getElementById("msg");

  let snake, dir, nextDir, food, score, timer;
  let best = 0;
  try { best = Number(localStorage.getItem("snakeBest")) || 0; } catch (e) {}
  bestEl.textContent = best;

  function placeFood() {
    do {
      food = { x: Math.floor(Math.random() * SIZE), y: Math.floor(Math.random() * SIZE) };
    } while (snake.some(s => s.x === food.x && s.y === food.y));
  }

  function start() {
    clearInterval(timer);
    snake = [{ x: 10, y: 10 }, { x: 9, y: 10 }, { x: 8, y: 10 }];
    dir = { x: 1, y: 0 };
    nextDir = dir;
    score = 0;
    scoreEl.textContent = 0;
    msg.textContent = "Eat the red food. Don't hit the walls or yourself.";
    placeFood();
    draw();
    timer = setInterval(tick, 120);
  }

  function tick() {
    dir = nextDir;
    const head = { x: snake[0].x + dir.x, y: snake[0].y + dir.y };
    const hitWall = head.x < 0 || head.y < 0 || head.x >= SIZE || head.y >= SIZE;
    const hitSelf = snake.some(s => s.x === head.x && s.y === head.y);
    if (hitWall || hitSelf) return gameOver();

    snake.unshift(head);
    if (head.x === food.x && head.y === food.y) {
      score++;
      scoreEl.textContent = score;
      placeFood();
    } else {
      snake.pop();
    }
    draw();
  }

  function gameOver() {
    clearInterval(timer);
    if (score > best) {
      best = score;
      bestEl.textContent = best;
      try { localStorage.setItem("snakeBest", best); } catch (e) {}
    }
    msg.textContent = "Game over. Your score: " + score + ". Press Start to play again.";
  }

  function draw() {
    ctx.clearRect(0, 0, canvas.width, canvas.height);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--food");
    ctx.fillRect(food.x * CELL + 2, food.y * CELL + 2, CELL - 4, CELL - 4);
    ctx.fillStyle = getComputedStyle(document.documentElement).getPropertyValue("--snake");
    snake.forEach(s => ctx.fillRect(s.x * CELL + 1, s.y * CELL + 1, CELL - 2, CELL - 2));
  }

  function turn(x, y) {
    // Block 180-degree turns so the snake can't reverse into itself.
    if (x === -dir.x && y === -dir.y) return;
    nextDir = { x, y };
  }

  const keys = {
    ArrowUp: [0, -1], w: [0, -1], ArrowDown: [0, 1], s: [0, 1],
    ArrowLeft: [-1, 0], a: [-1, 0], ArrowRight: [1, 0], d: [1, 0]
  };
  document.addEventListener("keydown", e => {
    const k = keys[e.key];
    if (k && dir) { e.preventDefault(); turn(k[0], k[1]); }
  });

  document.getElementById("up").onclick = () => dir && turn(0, -1);
  document.getElementById("down").onclick = () => dir && turn(0, 1);
  document.getElementById("left").onclick = () => dir && turn(-1, 0);
  document.getElementById("right").onclick = () => dir && turn(1, 0);
  document.getElementById("start").onclick = start;

  // Swipe support on the board
  let sx, sy;
  canvas.addEventListener("touchstart", e => { sx = e.touches[0].clientX; sy = e.touches[0].clientY; });
  canvas.addEventListener("touchend", e => {
    if (!dir) return;
    const dx = e.changedTouches[0].clientX - sx, dy = e.changedTouches[0].clientY - sy;
    if (Math.abs(dx) > Math.abs(dy)) turn(dx > 0 ? 1 : -1, 0); else turn(0, dy > 0 ? 1 : -1);
  });
</script>
</body>
</html>
